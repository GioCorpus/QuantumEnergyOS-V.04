[package]
name = "qeos-kernel"
version = "1.0.0"
edition = "2021"
description = "QEOS Kernel V1 — monolithic modular Rust-first kernel core (host-testable logic + x86_64 HAL stubs)"
license = "MIT"
authors = ["QuantumEnergyOS Contributors"]

[lib]
name = "qeos_kernel"
path = "src/lib.rs"

[[bin]]
name = "qeos-kernel"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "z"
lto = true
panic = "abort"