[workspace]
members = [
   "kernel",
   "crates/system-core",
   "crates/quantum-runtime",
   "crates/quantum-hal",
   # DEBT(PHASE-4.1): "crates/quantum-service" was declared by an in-flight
   # workstream but the crate does not exist in the tree, which makes the whole
   # workspace unresolvable (`failed to load manifest for workspace member`).
   # Re-enable the member in the same commit that adds the crate.
   # "crates/quantum-service",
   "crates/energy-telemetry",
   "crates/quartz5d",
   "crates/identity-service",
   "crates/hardware-abstraction",
   "crates/device-manager",
   "crates/qeos-qpu",
   "crates/qeos-gpu-compute",
   "crates/qeos-node",
   "crates/qeos-cluster",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["QuantumEnergyOS Contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Async runtime & IPC
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

# Cryptography & security
argon2 = "0.5"
jsonwebtoken = "9.0"
sha2 = "0.10"
rand = "0.8"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database (Phase 3)
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "chrono", "uuid", "json"] }

# Metrics & monitoring (Phase 3)
# NOTE: entries in [workspace.dependencies] cannot be `optional`. A member that
# wants an optional metrics exporter declares `{ workspace = true, optional = true }`
# in its own manifest.
prometheus = "0.13"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Internal crates (workspace-pinned so every member resolves one version)
quantum-runtime = { path = "crates/quantum-runtime" }
quantum-hal = { path = "crates/quantum-hal" }
qeos-qpu = { path = "crates/qeos-qpu" }
qeos-gpu-compute = { path = "crates/qeos-gpu-compute" }
# DEBT(PHASE-4.1): see the workspace member list above — crate not present yet.
# quantum-service = { path = "crates/quantum-service" }
system-core = { path = "crates/system-core" }
identity-service = { path = "crates/identity-service" }
energy-telemetry = { path = "crates/energy-telemetry" }
hardware-abstraction = { path = "crates/hardware-abstraction" }
device-manager = { path = "crates/device-manager" }
qeos-node = { path = "crates/qeos-node" }
qeos-cluster = { path = "crates/qeos-cluster" }

[profile.dev]
debug = true
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
