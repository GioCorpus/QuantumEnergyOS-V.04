[workspace]
members = [
  "crates/system-core",
  "crates/quantum-runtime",
  "crates/energy-telemetry",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["QuantumEnergyOS Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.dev]
debug = true
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
